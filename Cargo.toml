[package]
name = "gas-auction-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
ethers = { version = "2.0", features = ["rustls", "ws"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
anyhow = "1.0"
thiserror = "1.0"
config = "0.13"
prometheus = "0.13"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
tokio-stream = "0.1"
lru = "0.12"
dashmap = "5.5"
once_cell = "1.19"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
